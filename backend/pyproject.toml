[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line-too-long handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "routes", "services", "utils"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

